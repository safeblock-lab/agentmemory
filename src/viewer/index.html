      if (recovery && recovery.action === 'none' && result.status === 'partial' && result.continuation) html += '<button class="btn" data-action="continue-graph-build"' + (graphRebuilding ? ' disabled' : '') + '>Continue project rebuild</button>';
      if (recovery && recovery.action !== 'none' && !(availability && availability.enabled === false) && !graphRecoveryAction(result)) html += '<div>The server did not return a usable recovery continuation. Recovery status is retained.</div>';
      return html + '</div>';
    }

    async function rebuildGraph(continuation, automatic) {
      var project = state.graph.selectedProject;
      var requestId = state.graph.requestId;
      if (graphRebuilding || !project) return;
      if (automatic) {
        var action = graphRecoveryAction(state.graph.rebuildResult);
        if (!action || action.project !== project || action.continuation !== continuation) return;
      } else {
        if (graphRecoveryPending()) return;
        if (!window.confirm('Process one bounded graph rebuild unit for project "' + project + '"?\n\nWith an LLM provider configured this spends provider tokens. Automatic recovery follows the retained job; additional source units require another click.')) return;
      }
      clearTimeout(graphRecoveryTimer);
      graphRebuilding = true;
      state.graph.rebuildInvocationError = null;
      renderGraphSidebar();
      var body = { project: project };
      if (continuation) body.continuation = continuation;
      try {
        var result = await api('graph/build', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), readErrorBody: true });
        if (requestId !== state.graph.requestId || project !== state.graph.selectedProject) return;
        if (!result || result.project !== project || ['completed', 'partial', 'queued', 'failed'].indexOf(result.status) < 0) {
          state.graph.rebuildInvocationError = 'The request outcome could not be confirmed. The last known job state is retained; no further recovery request has been sent.';
          return;
        }
        state.graph.rebuildResult = result;
        updateGraphAutomaticAvailability(result);
        scheduleGraphRecovery(result);
        await loadGraph();
      } catch (error) {
        if (requestId === state.graph.requestId && project === state.graph.selectedProject) state.graph.rebuildInvocationError = 'The request outcome could not be confirmed. The last known job state is retained; no further recovery request has been sent.';
      } finally {
        graphRebuilding = false;
        renderGraphSidebar();
      }
    }

    function drawNodeShape(ctx, x, y, r, type) {
      var shape = NODE_SHAPES[type] || 'circle';
      switch(shape) {
        case 'rect':
          ctx.beginPath();
          ctx.rect(x - r, y - r * 0.75, r * 2, r * 1.5);
          break;
        case 'diamond':
          ctx.beginPath();
          ctx.moveTo(x, y - r);
          ctx.lineTo(x + r, y);
          ctx.lineTo(x, y + r);
          ctx.lineTo(x - r, y);
          ctx.closePath();
          break;
        case 'hexagon':
          ctx.beginPath();
          for (var i = 0; i < 6; i++) {
            var angle = (Math.PI / 3) * i - Math.PI / 2;
            var hx = x + r * Math.cos(angle);
            var hy = y + r * Math.sin(angle);
            if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          break;
        default:
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          break;
      }
    }

    function fitGraphToView() {
      var canvas = graphSim.canvas;
      if (!canvas || graphSim.nodes.length === 0) return;
      var w = canvas.width / window.devicePixelRatio;
      var h = canvas.height / window.devicePixelRatio;
      var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      graphSim.nodes.forEach(function(n) {
        if (n.x < minX) minX = n.x;
        if (n.x > maxX) maxX = n.x;
        if (n.y < minY) minY = n.y;
        if (n.y > maxY) maxY = n.y;
      });
      var pad = 150;
      var spanX = (maxX - minX) + pad * 2;
      var spanY = (maxY - minY) + pad * 2;
      var z = Math.min(w / spanX, h / spanY);
      graphSim.zoom = Math.max(0.35, Math.min(1.4, z));
      graphSim.panX = w / 2 - ((minX + maxX) / 2) * graphSim.zoom;
      graphSim.panY = h / 2 - ((minY + maxY) / 2) * graphSim.zoom;
    }

    function renderGraph() {
      var ctx = graphSim.ctx;
      var canvas = graphSim.canvas;
      if (!ctx || !canvas) return;
      var w = canvas.width / window.devicePixelRatio;
      var h = canvas.height / window.devicePixelRatio;

      ctx.clearRect(0, 0, w, h);

      // --- Canvas grid background ---
      var gridSize = 24;
      ctx.save();
      ctx.strokeStyle = isDarkMode() ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
      ctx.lineWidth = 0.5;
      for (var gx = 0; gx < w; gx += gridSize) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
      }
      for (var gy = 0; gy < h; gy += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(graphSim.panX, graphSim.panY);
      ctx.scale(graphSim.zoom, graphSim.zoom);

      var nodeMap = {};
      graphSim.nodes.forEach(function(n) { nodeMap[n.id] = n; });

      var searchActive = graphSearchTerm.length > 0;
      var drawnLabelRects = [];
      function labelFits(x, y, w2, h2) {
        for (var li = 0; li < drawnLabelRects.length; li++) {
          var r = drawnLabelRects[li];
          if (x < r.x + r.w && x + w2 > r.x && y < r.y + r.h && y + h2 > r.y) return false;
        }
        drawnLabelRects.push({ x: x, y: y, w: w2, h: h2 });
        return true;
      }
      var totalVisible = graphSim.nodes.filter(function(n) { return state.graph.filters[n.type]; }).length;
      var isDense = totalVisible > 40;
      var labelZoomThreshold = isDense ? 1.5 : 0.5;
      var edgeLabelZoomThreshold = isDense ? 2.5 : 1.2;
      var selectedId = state.graph.selectedNode ? state.graph.selectedNode.id : null;

      // --- Hover node detection for focus effect ---
      var hoverNodeId = null;
      if (!graphSim.dragNode && graphSim.canvas) {
        var rect = graphSim.canvas.getBoundingClientRect();
        var hx = (graphSim.mouseX - rect.left - graphSim.panX) / graphSim.zoom;
        var hy = (graphSim.mouseY - rect.top - graphSim.panY) / graphSim.zoom;
        for (var hi = graphSim.nodes.length - 1; hi >= 0; hi--) {
          var hn = graphSim.nodes[hi];
          if (!state.graph.filters[hn.type]) continue;
          var hdx = hn.x - hx, hdy = hn.y - hy;
          if (hdx * hdx + hdy * hdy < hn.r * hn.r + 25) { hoverNodeId = hn.id; break; }
        }
      }
      var focusNodeId = selectedId || hoverNodeId;

      // --- Draw edges ---
      graphSim.edges.forEach(function(e) {
        var s = nodeMap[e.sourceNodeId];
        var t = nodeMap[e.targetNodeId];
        if (!s || !t) return;
        if (!state.graph.filters[s.type] || !state.graph.filters[t.type]) return;

        var edgeDimmed = searchActive && !(s.name.toLowerCase().includes(graphSearchTerm) || t.name.toLowerCase().includes(graphSearchTerm));
        var isConnectedToFocus = focusNodeId && (e.sourceNodeId === focusNodeId || e.targetNodeId === focusNodeId);
        var isFocusActive = focusNodeId !== null;
        var weight = typeof e.weight === 'number' ? e.weight : 0.5;
        var lineWidth = isConnectedToFocus ? 2 + weight * 2 : 1 + weight * 1.5;

        var dx = t.x - s.x;
        var dy = t.y - s.y;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var curveOffset = isDense ? 12 : 18;
        var offsetX = -dy / len * curveOffset;
        var offsetY = dx / len * curveOffset;
        var cpx = (s.x + t.x) / 2 + offsetX;
        var cpy = (s.y + t.y) / 2 + offsetY;

        // Colored edges based on source node type
        var edgeColor = NODE_COLORS[s.type] || '#666666';
        var edgeAlpha;
        if (edgeDimmed) {
          edgeAlpha = 0.06;
        } else if (isFocusActive && isConnectedToFocus) {
          edgeAlpha = 0.65;
        } else if (isFocusActive && !isConnectedToFocus) {
          edgeAlpha = 0.06;
        } else {
          edgeAlpha = isDense ? 0.15 : 0.25;
        }

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.quadraticCurveTo(cpx, cpy, t.x, t.y);
        // Parse hex color to rgba
        var r = parseInt(edgeColor.slice(1,3), 16);
        var g = parseInt(edgeColor.slice(3,5), 16);
        var b = parseInt(edgeColor.slice(5,7), 16);
        ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + edgeAlpha + ')';
        ctx.lineWidth = lineWidth;
        ctx.stroke();

        if (!isDense || isConnectedToFocus) {
          var arrowAngle = Math.atan2(t.y - cpy, t.x - cpx);
          var arrowLen = 5 + lineWidth;
          ctx.beginPath();
          ctx.moveTo(t.x - t.r * Math.cos(arrowAngle), t.y - t.r * Math.sin(arrowAngle));
          ctx.lineTo(t.x - (t.r + arrowLen) * Math.cos(arrowAngle - 0.3), t.y - (t.r + arrowLen) * Math.sin(arrowAngle - 0.3));
          ctx.lineTo(t.x - (t.r + arrowLen) * Math.cos(arrowAngle + 0.3), t.y - (t.r + arrowLen) * Math.sin(arrowAngle + 0.3));
          ctx.closePath();
          ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (edgeDimmed ? 0.06 : isConnectedToFocus ? 0.6 : 0.2) + ')';
          ctx.fill();
        }

        var showEdgeLabel = e.type && !edgeDimmed && (isConnectedToFocus ? graphSim.zoom > 0.6 : graphSim.zoom > edgeLabelZoomThreshold);
        if (showEdgeLabel) {
          var zoomInv = 1 / graphSim.zoom;
          ctx.save();
          ctx.fillStyle = isDarkMode() ? (isConnectedToFocus ? 'rgba(238,238,238,0.9)' : 'rgba(180,180,180,0.7)') : (isConnectedToFocus ? 'rgba(17,17,17,0.85)' : 'rgba(80,80,80,0.7)');
          ctx.font = (isConnectedToFocus ? '600 ' : '500 ') + (11 * zoomInv).toFixed(1) + 'px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(e.type, cpx, cpy - (4 * zoomInv));
          ctx.restore();
        }
      });

      // --- Draw nodes ---
      graphSim.nodes.forEach(function(n) {
        if (!state.graph.filters[n.type]) return;
        var color = NODE_COLORS[n.type] || '#666666';
        var isSelected = selectedId === n.id;
        var isHovered = hoverNodeId === n.id;
        var matchesSearch = !searchActive || n.name.toLowerCase().includes(graphSearchTerm);
        var isFocusFaded = graphSim.edges.length > 0 && focusNodeId && n.id !== focusNodeId && !graphSim.edges.some(function(ed) {
          return (ed.sourceNodeId === focusNodeId && ed.targetNodeId === n.id) ||
                 (ed.targetNodeId === focusNodeId && ed.sourceNodeId === n.id);
        });

        var nodeAlpha = !matchesSearch ? 0.12 : (isFocusFaded ? 0.2 : 1);

        ctx.save();
        ctx.globalAlpha = nodeAlpha;

        // Glow effect
        if (matchesSearch && !isFocusFaded && (isSelected || isHovered || !searchActive)) {
          ctx.shadowColor = color;
          ctx.shadowBlur = isSelected ? 20 : isHovered ? 16 : (isDense ? 4 : 8);
        }

        // Gradient fill
        drawNodeShape(ctx, n.x, n.y, n.r, n.type);
        var grad = ctx.createRadialGradient(n.x - n.r * 0.3, n.y - n.r * 0.3, 0, n.x, n.y, n.r * 1.2);
        var cr = parseInt(color.slice(1,3), 16);
        var cg = parseInt(color.slice(3,5), 16);
        var cb = parseInt(color.slice(5,7), 16);
        grad.addColorStop(0, 'rgba(' + Math.min(255, cr + 60) + ',' + Math.min(255, cg + 60) + ',' + Math.min(255, cb + 60) + ',0.95)');
        grad.addColorStop(1, color);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();

        // Selected ring
        if (isSelected) {
          ctx.save();
          drawNodeShape(ctx, n.x, n.y, n.r + 3, n.type);
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.shadowColor = color;
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.restore();
        } else if (isHovered) {
          drawNodeShape(ctx, n.x, n.y, n.r + 2, n.type);
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (searchActive && matchesSearch) {
          drawNodeShape(ctx, n.x, n.y, n.r, n.type);
          ctx.strokeStyle = '#CC0000';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        var showLabel = matchesSearch && !isFocusFaded && (
          isSelected || isHovered ||
          (searchActive && matchesSearch) ||
          (totalVisible <= 30 && graphSim.zoom > 0.5) ||
          (!isDense && graphSim.zoom > labelZoomThreshold) ||
          (isDense && graphSim.zoom > labelZoomThreshold && n.r > 10)
        );
        if (showLabel) {
          var zoomInv = 1 / graphSim.zoom;
          ctx.save();
          ctx.font = (isSelected || isHovered ? '600 ' : '500 ') + (13 * zoomInv).toFixed(1) + 'px Inter, sans-serif';
          ctx.textAlign = 'center';
          
          var label = truncate(n.name, 18);
          var textW = ctx.measureText(label).width;
          var labelW = textW + (16 * zoomInv);
          var labelH = 20 * zoomInv;
          var labelY = n.y + n.r + (8 * zoomInv); // Top of the background pill
          // Selected/hovered labels always win; others draw only into
          // free space so zoomed-out views degrade to fewer labels
          // instead of a pile of overlapping pills.
          if (!isSelected && !isHovered && !labelFits(n.x - labelW / 2, labelY, labelW, labelH)) {
            ctx.restore();
            return;
          }
          ctx.fillStyle = isDarkMode() ? 'rgba(30,30,35,0.92)' : 'rgba(255,255,255,0.92)';
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(n.x - labelW / 2, labelY, labelW, labelH, 4 * zoomInv) : ctx.rect(n.x - labelW / 2, labelY, labelW, labelH);
          ctx.fill();
          
          ctx.strokeStyle = isDarkMode() ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
          ctx.lineWidth = 1 * zoomInv;
          ctx.stroke();

          ctx.fillStyle = isDarkMode() ? (isSelected || isHovered ? '#eeeeee' : '#bbbbbb') : (isSelected || isHovered ? '#111111' : '#444444');
          // Vertically center text in the pill box
          ctx.fillText(label, n.x, labelY + (14 * zoomInv));
          ctx.restore();
        }
      });

      ctx.restore();

      if (graphSim.nodes.length === 0) {
        ctx.fillStyle = '#999999';
        ctx.font = '14px Lora, Georgia, serif';
        ctx.textAlign = 'center';
        var graphEmptyTitle = state.graph.disabledInfo ? 'Knowledge graph is off.' : state.graph.queryError ? 'Graph query failed.' : state.graph.queryPartial ? ('Preparing project graph.') : 'No graph data in this selection.';
        ctx.fillText(graphEmptyTitle, w / 2, h / 2 - 16);
        ctx.font = '12px Inter, sans-serif';
        ctx.fillText(state.graph.disabledInfo ? 'Enable knowledge graph extraction in configuration.' : state.graph.queryPartial ? 'Preparation runs in bounded batches. Progress is shown in the sidebar.' : state.graph.queryError ? 'Retry this view after checking the server error.' : 'Select another scope or return after new graph data is available.', w / 2, h / 2 + 8);
      }
    }

    async function loadMemories(cursor) {
      var request = state.memories.requestId = (state.memories.requestId || 0) + 1;
      var project = state.memories.project || '';
      var el = document.getElementById('view-memories');
      if (!state.memories.loaded) el.innerHTML = '<div class="loading">Loading memories...</div>';
      var result = await api('memories?latest=true&limit=16' + (project ? '&project=' + encodeURIComponent(project) : '') + (cursor ? '&cursor=' + encodeURIComponent(cursor) : ''), { readErrorBody: true });
      if (request !== state.memories.requestId || project !== (state.memories.project || '')) return;
      if (!result || result.error || !Array.isArray(result.memories)) {
        state.memories.error = result && result.error || 'Memory request failed. Retained data may be stale.';
        renderMemories(); return;
      }
      state.memories.error = result.reason && result.reason !== 'no_sessions' ? result.reason : '';
      state.memories.cursor = cursor || null;
      var items = (result && result.memories) || [];
      // Newest first — server returns KV-insertion order.
      items.sort(function(a, b) {
        var ac = (a && a.createdAt) || (a && a.updatedAt) || '';
        var bc = (b && b.createdAt) || (b && b.updatedAt) || '';
        return bc.localeCompare(ac);
      });
      state.memories.items = items;
      state.memories.total = result && result.total;
      state.memories.partial = !!(result && result.partial);
      state.memories.nextCursor = result && result.nextCursor;
      state.memories.loaded = true;
      renderMemories();
    }

    function renderMemories() {
      var el = document.getElementById('view-memories');
      var items = state.memories.items;
      var search = state.memories.search.toLowerCase();
      var typeFilter = state.memories.typeFilter;

      var filtered = items.filter(function(m) {
        if (typeFilter && m.type !== typeFilter) return false;
        const normalizedSearch = (search || '')
          .normalize("NFKC")
          .toLowerCase();
 
        const normalizedTitle = (m.title || '')
          .normalize("NFKC")
          .toLowerCase();

        const normalizedContent = (m.content || '')
          .normalize("NFKC")
          .toLowerCase();

        if (
          search &&
          !normalizedTitle.includes(normalizedSearch) &&
          !normalizedContent.includes(normalizedSearch)
        ) {
        return false;
        }

        return true;
      });

      var types = {};
      items.forEach(function(m) { types[m.type] = true; });
      var typeOptions = Object.keys(types).sort();

      var html = '<div class="card" style="margin-bottom:12px;padding:12px;background:var(--bg-subtle);">';
      html += '<div style="font-size:13px;color:var(--ink-muted);line-height:1.5;">';
      html += '<strong>Memories</strong> are durable facts, architecture notes, conventions, and lessons saved via <code>memory_remember</code> MCP tool or the <code>/agentmemory/remember</code> endpoint. They survive across sessions and supersede each other as v1, v2, etc. ';
      html += '<span role="status" style="color:var(--ink-faint);">Shown: ' + items.length + ' on this page.' + (state.memories.partial ? ' Results are partial; the full total is unavailable.' : '') + '</span>';
      html += '</div></div>';

      html += '<div class="toolbar">';
      html += '<label>Project <input id="mem-project" placeholder="All projects" value="' + esc(state.memories.project || '') + '"></label><button class="btn" id="mem-project-open">Open scope</button>';
      html += '<input type="text" id="mem-search" aria-label="Search this memory page" placeholder="Search this page..." value="' + esc(state.memories.search) + '">';
      html += '<select id="mem-type-filter" aria-label="Memory type on this page"><option value="">All types</option>';
      typeOptions.forEach(function(t) {
        html += '<option value="' + esc(t) + '"' + (typeFilter === t ? ' selected' : '') + '>' + esc(t) + '</option>';
      });
      html += '</select></div>';
      html += '<p role="status">Filters apply to this page. Scope: ' + esc(state.memories.project || 'all projects') + '.</p>';
      if (state.memories.error) html += '<p role="status">' + esc(state.memories.error) + '</p>';
      html += '<button class="btn" id="mem-first-page">Refresh first page</button> ';
      if (state.memories.nextCursor) html += '<button class="btn" id="mem-next-page">Next memory page</button>';
      if (filtered.length === 0 && state.memories.error) {
        html += '<p role="status">Memory data is unavailable or preparing. Retry this scope.</p>';
      } else if (filtered.length === 0 && (state.memories.partial || search || typeFilter)) {
        html += '<p role="status">No matching memories on this page. Continue to the next page to browse more.</p>';
      } else if (filtered.length === 0) {
        html += '<div class="empty-state">' +
          '<div class="empty-icon">&#128218;</div>' +
          '<div class="empty-title">No memories yet</div>' +
          '<div class="empty-lead">Memories are the distilled facts agentmemory keeps across sessions &mdash; things like file paths, architectural decisions, and user preferences. Hooks capture them automatically during coding sessions; you can also save one directly.</div>' +
          '<pre class="empty-cmd">memory_remember {\n  title: "auth uses jose middleware",\n  content: "src/middleware/auth.ts handles JWT validation",\n  type: "architecture"\n}</pre>' +
          '<div><a class="empty-link" href="https://github.com/rohitg00/agentmemory#memories" target="_blank" rel="noopener">Memory types &rarr;</a></div>' +
          '</div>';
      } else {
        html += '<table><tr><th>Title</th><th>Type</th><th>Strength</th><th>Version</th><th>Updated</th><th>Actions</th></tr>';
        filtered.forEach(function(m) {
          var badgeClass = TYPE_BADGES[m.type] || 'badge-muted';
          var rawStrength = m.strength || 0;
          var strength = Math.round(rawStrength <= 1 ? rawStrength * 100 : rawStrength * 10);
          if (strength > 100) strength = 100;
          var barColor = strength > 70 ? 'var(--green)' : strength > 40 ? 'var(--yellow)' : 'var(--red)';
          var expanded = state.memories.selectedId === m.id;
          html += '<tr class="memory-row' + (expanded ? ' selected' : '') + '" data-action="select-memory" data-memory-id="' + esc(m.id) + '" role="button" tabindex="0" aria-expanded="' + (expanded ? 'true' : 'false') + '" style="cursor:pointer;">';
          var preview = (m.content || '').split('\n').slice(0, 2).join(' ').trim();
          var previewHtml = esc(truncate(preview, 150));
          if (search && search.length > 2) {
            var re = new RegExp('(' + search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
            previewHtml = previewHtml.replace(re, '<mark>$1</mark>');
          }
          html += '<td><span style="color:var(--ink);font-weight:600;">' + esc(truncate(m.title, 50)) + '</span>';
          html += '<div style="font-size:12px;color:var(--ink-muted);margin-top:3px;line-height:1.4;max-height:34px;overflow:hidden;">' + previewHtml + '</div>';
          if (m.concepts && m.concepts.length > 0) {
            html += '<div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap;">';
            m.concepts.slice(0, 4).forEach(function(c) { html += '<span class="tag">' + esc(c) + '</span>'; });
            html += '</div>';
          }
          html += '</td>';
          html += '<td><span class="badge ' + badgeClass + '">' + esc(m.type) + '</span></td>';
          html += '<td><div class="strength-bar"><div class="fill" style="width:' + strength + '%;background:' + barColor + '"></div></div> <span style="font-size:10px;color:var(--ink-faint);font-family:var(--font-mono);">' + strength + '%</span></td>';
          html += '<td style="color:var(--ink-muted);font-family:var(--font-mono);font-size:12px;">v' + (m.version || 1) + '</td>';
          html += '<td style="font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);">' + esc(formatTime(m.updatedAt)) + '</td>';
          html += '<td><button class="btn btn-danger" style="font-size:9px;padding:2px 8px;" data-action="delete-memory" data-memory-id="' + esc(m.id) + '" data-memory-title="' + esc(m.title || '') + '">Delete</button></td>';
          html += '</tr>';
          if (expanded) {
            html += '<tr class="memory-detail-row"><td colspan="6" style="background:var(--bg-alt);padding:14px 16px;">';
            html += '<div style="font-size:13px;color:var(--ink);white-space:pre-wrap;line-height:1.5;margin-bottom:10px;">' + esc(m.content || '') + '</div>';
            html += '<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-muted);font-family:var(--font-mono);margin-bottom:10px;">';
            html += '<span>id: ' + esc(m.id) + '</span>';
            if (m.origin && m.origin.channel) {
              html += '<span>origin: ' + esc(m.origin.channel) + (m.origin.detail ? ' (' + esc(m.origin.detail) + ')' : '') + '</span>';
            }
            if (m.project) html += '<span>project: ' + esc(m.project) + '</span>';
            if (m.createdAt) html += '<span>created: ' + esc(formatTime(m.createdAt)) + '</span>';
            if (m.supersedes && m.supersedes.length > 0) html += '<span>supersedes: ' + esc(m.supersedes.join(', ')) + '</span>';
            if (m.files && m.files.length > 0) html += '<span>files: ' + esc(m.files.join(', ')) + '</span>';
            if (m.sessionIds && m.sessionIds.length > 0) html += '<span>sessions: ' + m.sessionIds.length + '</span>';
            html += '</div>';
            html += '<details><summary style="cursor:pointer;font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);">raw record</summary>';
            html += '<pre style="margin-top:8px;padding:10px;background:var(--bg);border:1px solid var(--border);font-size:11px;line-height:1.5;overflow-x:auto;">' + esc(JSON.stringify(m, null, 2)) + '</pre></details>';
            html += '</td></tr>';
          }
        });
        html += '</table>';
      }

      var __focus = captureSearchFocus(['mem-search', 'mem-project']);
      setViewHtml(el, html);

      var searchInput = document.getElementById('mem-search');
      document.getElementById('mem-first-page').addEventListener('click', function() { this.disabled = true; loadMemories(); });
      var openScope = function() {
        state.memories.project = document.getElementById('mem-project').value.trim();
        state.memories.items = []; state.memories.nextCursor = null; state.memories.loaded = false;
        loadMemories();
      };
      document.getElementById('mem-project-open').addEventListener('click', openScope);
      document.getElementById('mem-project').addEventListener('keydown', function(event) { if (event.key === 'Enter') { event.preventDefault(); openScope(); } });
      var memoryNext = document.getElementById('mem-next-page');
      if (memoryNext) memoryNext.addEventListener('click', function() { this.disabled = true; loadMemories(state.memories.nextCursor); });
      if (searchInput) {
        bindImeSafeSearch(searchInput, 200, function(v){ state.memories.search = v; renderMemories(); });
      }
      var typeSelect = document.getElementById('mem-type-filter');
      if (typeSelect) {
        typeSelect.addEventListener('change', function() {
          state.memories.typeFilter = this.value;
          renderMemories();
        });
      }
      restoreSearchFocus(__focus);
    }

    var timelineRequest = 0;

    async function loadTimeline(cursor) {
      var request = ++timelineRequest;
      var el = document.getElementById('view-timeline');
      if (!state.timeline.loaded) el.innerHTML = '<div class="loading">Loading timeline...</div>';
      var sessResult = await recentViewerPage('sessions', cursor);
      if (request !== timelineRequest) return;
      if (!sessResult) { showRecentError(el, 'sessions'); return; }
      var sessions = sessResult.sessions;
      state.timeline.sessionNextCursor = sessResult.nextCursor;
      state.timeline.loaded = true;
      if (sessions.length && !state.timeline.sessionId) {
        var firstSelectable = sessions.find(function(session) { return sessionId(session); });
        state.timeline.sessionId = firstSelectable ? sessionId(firstSelectable) : '';
        state.timeline.observationCursor = null;
      }
      renderTimelineToolbar(sessions);
      if (state.timeline.sessionId) await loadObservations(state.timeline.observationCursor);
      else renderObservations();
    }

    function renderTimelineToolbar(sessions) {
      var el = document.getElementById('view-timeline');
      var html = '<div class="toolbar">';
      html += '<select id="tl-session" aria-label="Timeline session"><option value="">Select session</option>';
      if (state.timeline.sessionId && !sessions.some(function(session) { return sessionId(session) === state.timeline.sessionId; })) {
        html += '<option selected value="' + esc(state.timeline.sessionId) + '">' + esc(state.timeline.sessionId) + ' (selected session)</option>';
      }
      sessions.sort(function(a, b) { return (b.startedAt || '').localeCompare(a.startedAt || ''); }).forEach(function(s) {
        var id = sessionId(s);
        var disabled = id ? '' : ' disabled';
        html += '<option value="' + esc(id) + '"' + (id && state.timeline.sessionId === id ? ' selected' : '') + disabled + '>' + esc(sessionLabel(s)) + '</option>';
      });
      html += '</select>';
      html += '<select id="tl-importance" aria-label="Minimum importance"><option value="0">All importance</option>';
      for (var i = 1; i <= 9; i++) {
        html += '<option value="' + i + '"' + (state.timeline.minImportance === i ? ' selected' : '') + '>&ge; ' + i + '</option>';
      }
      html += '</select>';
      if (state.timeline.sessionNextCursor) html += '<button class="btn" id="tl-sessions-next">Next sessions</button>';
      html += '</div><div id="tl-content"></div>';
      el.innerHTML = html;

      document.getElementById('tl-session').addEventListener('change', function() {
        state.timeline.sessionId = this.value;
        state.timeline.observationCursor = null;
        tlTypeFilter = '';
        state.timeline.page = 0;
        state.timeline.observations = [];
        renderObservations();
        loadObservations();
      });
      document.getElementById('tl-importance').addEventListener('change', function() {
        state.timeline.minImportance = parseInt(this.value);
        state.timeline.page = 0;
        renderObservations();
      });
      var sessionNext = document.getElementById('tl-sessions-next');
      if (sessionNext) sessionNext.addEventListener('click', function() { this.disabled = true; state.timeline.sessionId = ''; loadTimeline(state.timeline.sessionNextCursor); });
    }

    async function loadObservations(cursor) {
      var request = ++observationRequest;
      var selectedSession = state.timeline.sessionId;
      var content = document.getElementById('tl-content');
      if (!content) return;
      if (!selectedSession) { content.innerHTML = '<div class="empty-state"><p>Select a session to view observations</p></div>'; return; }
      if (!state.timeline.observations.length) content.innerHTML = '<p role="status">Loading observations...</p>';
      var result = await recentViewerPage('observations', cursor, selectedSession);
      if (request !== observationRequest || selectedSession !== state.timeline.sessionId) return;
      if (!result) { showRecentError(content, 'observations'); return; }
      state.timeline.observationCursor = cursor || null;
      state.timeline.partial = !!result.partial;
      state.timeline.nextCursor = result.nextCursor;
      state.timeline.observations = result.observations;
      state.timeline.page = 0;
      renderObservations();
    }

    function latestTimelineObservations(observations) {
      return observations.slice().sort(function(a, b) {
        var aTime = Date.parse(a.timestamp) || 0;
        var bTime = Date.parse(b.timestamp) || 0;
        return bTime - aTime;
      }).slice(0, 200);
    }

    var tlTypeFilter = '';

    function renderObservations() {
      var content = document.getElementById('tl-content');
      if (!content) return;
      var obs = latestTimelineObservations(state.timeline.observations);
      var minImp = state.timeline.minImportance;
      var filtered = minImp > 0 ? obs.filter(function(o) { return (o.importance || 0) >= minImp; }) : obs;

      var TOOL_TYPE_MAP = { Read: 'file_read', Write: 'file_write', Edit: 'file_edit', Bash: 'command_run', Grep: 'search', Glob: 'search', WebFetch: 'web_fetch', WebSearch: 'web_fetch', AskUserQuestion: 'conversation', Task: 'subagent' };

      var typeCounts = {};
      filtered.forEach(function(o) {
        var t = o.type || TOOL_TYPE_MAP[o.toolName] || (o.hookType ? o.hookType.replace(/_/g, ' ') : 'other');
        typeCounts[t] = (typeCounts[t] || 0) + 1;
      });
      var typeList = Object.keys(typeCounts).sort(function(a, b) { return typeCounts[b] - typeCounts[a]; });

      if (tlTypeFilter) {
        filtered = filtered.filter(function(o) {
          var t = o.type || TOOL_TYPE_MAP[o.toolName] || (o.hookType ? o.hookType.replace(/_/g, ' ') : 'other');
          return t === tlTypeFilter;
        });
      }

      var pageSize = state.timeline.pageSize;
      var page = state.timeline.page;
      var start = page * pageSize;
      var paged = filtered.slice(start, start + pageSize);
      var totalPages = Math.ceil(filtered.length / pageSize);

      var html = state.timeline.partial ? '<p role="status">Showing a bounded page; more observations may exist.</p>' : '';
      if (state.timeline.nextCursor) html += '<button class="btn" data-action="timeline-source-next">Next observations</button>';
      html += '<div class="type-chips">';
      html += '<button class="type-chip' + (!tlTypeFilter ? ' active' : '') + '" data-action="timeline-filter" data-type-filter="" aria-pressed="' + (!tlTypeFilter) + '">All (' + obs.length + ')</button>';
      typeList.forEach(function(t) {
        var color = OBS_TYPE_COLORS[t] || '#666666';
        html += '<button class="type-chip' + (tlTypeFilter === t ? ' active' : '') + '" data-action="timeline-filter" data-type-filter="' + esc(t) + '" aria-pressed="' + (tlTypeFilter === t) + '" style="' + (tlTypeFilter === t ? 'background:' + color + ';border-color:' + color + ';' : 'border-color:' + color + ';color:' + color + ';') + '">' + esc(t.replace(/_/g, ' ')) + ' (' + typeCounts[t] + ')</button>';
      });
      html += '</div>';

      if (paged.length === 0) {
        html += '<div class="empty-state"><div class="empty-icon">&#128337;</div><p>No observations' + (obs.length > 0 ? ' match the filter (' + obs.length + ' total)' : ' for this session') + '</p></div>';
        content.innerHTML = html;
        return;
      }

      html += '<div style="font-size:11px;color:var(--ink-faint);margin-bottom:16px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em;">' + filtered.length + ' matching observations in this bounded source window</div>';

      html += '<div class="timeline-container">';

      var lastDateGroup = '';
      paged.forEach(function(o, idx) {
        var isCompressed = !!o.narrative || !!o.type;
        var isRaw = !isCompressed;
        var type = o.type || TOOL_TYPE_MAP[o.toolName] || 'other';
        var impVal = typeof o.importance === 'number' ? o.importance : 5;
        var impClass = impVal >= 7 ? 'high' : impVal >= 4 ? 'med' : 'low';
        var title = o.title || o.toolName || (o.hookType ? o.hookType.replace(/_/g, ' ') : 'Observation');
        var typeColor = OBS_TYPE_COLORS[type] || '#666666';
        var icon = OBS_TYPE_ICONS[type] || '&#128196;';

        var dateGroup = '';
        try {
          var d = new Date(o.timestamp);
          dateGroup = d.toLocaleDateString() + ' ' + d.getHours() + ':00';
        } catch(e) { dateGroup = ''; }

        if (dateGroup && dateGroup !== lastDateGroup) {
          html += '<div class="timeline-date-marker"><span>' + esc(dateGroup) + '</span></div>';
          lastDateGroup = dateGroup;
        }

        var side = idx % 2 === 0 ? 'tl-left' : 'tl-right';

        html += '<div class="timeline-item ' + side + '">';
        html += '<div class="timeline-dot" style="background:' + typeColor + ';"></div>';
        html += '<div class="timeline-connector"></div>';

        html += '<div class="obs-card imp-' + impClass + '" style="border-left-color:' + typeColor + ';text-align:left;">';
        html += '<div class="obs-head">';
        html += '<div class="obs-title-row">';
        html += '<span class="obs-type-icon">' + icon + '</span>';
        html += '<span class="obs-title" title="' + esc(title) + '">' + esc(title) + '</span>';
        if (isRaw) html += '<span class="badge badge-muted" style="font-size:8px;margin-left:4px;">raw</span>';
        html += '</div>';
        html += '<div class="obs-meta">';
        if (isCompressed) html += '<span class="obs-importance imp-' + impVal + '" title="Importance: ' + impVal + '/10">' + impVal + '</span>';
        html += '<span class="obs-time">' + esc(shortTime(o.timestamp)) + '</span>';
        html += '</div></div>';

        if (o.subtitle) html += '<div class="obs-subtitle">' + esc(humanizeSubtitle(o.subtitle)) + '</div>';

        html += '<div style="margin-top:4px;">';
        html += '<span class="badge" style="border-color:' + typeColor + ';color:' + typeColor + ';margin-right:4px;">' + esc(type.replace(/_/g, ' ')) + '</span>';
        if (o.hookType) html += '<span class="badge badge-muted" style="margin-right:4px;">' + esc(o.hookType) + '</span>';
        html += '</div>';

        if (isRaw && o.toolInput) {
          var inputStr = typeof o.toolInput === 'string' ? o.toolInput : JSON.stringify(o.toolInput);
          html += '<div style="margin-top:6px;"><span style="font-size:10px;color:var(--ink-muted);font-weight:600;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:0.08em;">Input:</span>';
          html += '<pre style="font-size:11px;color:var(--ink-muted);background:var(--bg-alt);padding:8px 10px;border:1px solid var(--border-light);margin-top:3px;overflow-x:auto;max-height:80px;font-family:var(--font-mono);">' + esc(truncate(inputStr, 300)) + '</pre></div>';
        }
        if (isRaw && o.toolOutput) {
          var outputStr = typeof o.toolOutput === 'string' ? o.toolOutput : JSON.stringify(o.toolOutput);
          html += '<div style="margin-top:4px;"><span style="font-size:10px;color:var(--ink-muted);font-weight:600;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:0.08em;">Output:</span>';
          html += '<div class="obs-narrative" style="margin-top:3px;">' + esc(truncate(outputStr, 300)) + '</div></div>';
        }
        if (o.narrative) html += '<div class="obs-narrative" style="margin-top:8px;">' + esc(o.narrative) + '</div>';
        if (o.facts && o.facts.length > 0) {
          html += '<ul class="obs-facts">';
          o.facts.forEach(function(f) { html += '<li>' + esc(f) + '</li>'; });
          html += '</ul>';
        }

        var hasTags = (o.concepts && o.concepts.length) || (o.files && o.files.length);
        if (hasTags) {
          html += '<div class="tag-list">';
          (o.concepts || []).forEach(function(c) { html += '<span class="tag">' + esc(c) + '</span>'; });
          (o.files || []).forEach(function(f) {
            var short = f.split('/').pop();
            html += '<span class="tag file-tag" title="' + esc(f) + '">' + esc(short) + '</span>';
          });
          html += '</div>';
        }
        if (isRaw && o.toolInput) {
          var files = [];
          var ti = o.toolInput;
          if (typeof ti === 'object' && ti !== null) {
            if (ti.file_path) files.push(ti.file_path);
            if (ti.path) files.push(ti.path);
          }
          if (files.length > 0) {
            html += '<div class="tag-list">';
            files.forEach(function(f) {
              var short = String(f).split('/').pop();
              html += '<span class="tag file-tag" title="' + esc(f) + '">' + esc(short) + '</span>';
            });
            html += '</div>';
          }
        }
        html += '</div>';
        html += '</div>';
      });

      html += '</div>';

      if (totalPages > 1) {
        html += '<div class="pagination">';
        if (page > 0) html += '<button class="btn" data-action="timeline-page" data-page="' + (page - 1) + '">Prev</button>';
        html += '<span style="color:var(--ink-faint);font-size:12px;padding:6px;font-family:var(--font-mono);">Page ' + (page + 1) + ' of ' + totalPages + ' (' + filtered.length + ' total)</span>';
        if (page < totalPages - 1) html += '<button class="btn" data-action="timeline-page" data-page="' + (page + 1) + '">Next</button>';
        html += '</div>';
      }

      content.innerHTML = html;
    }

    function setTlTypeFilter(type) {
      tlTypeFilter = type;
      state.timeline.page = 0;
      renderObservations();
    }

    function tlPage(p) {
      state.timeline.page = p;
      renderObservations();
    }

    async function loadActivity() {
      var request = ++activityRequest;
      var el = document.getElementById('view-activity');
      if (!state.activity.loaded) el.innerHTML = '<div class="loading">Loading activity...</div>';
      var results = await Promise.all([recentViewerPage('sessions'), recentViewerPage('observations'), apiGet('audit?limit=200')]);
      if (request !== activityRequest) return;
      if (!results[0] || !results[1]) { showRecentError(el, !results[0] ? 'sessions' : 'observations'); return; }
      state.activity.sessions = results[0].sessions;
      state.activity.observations = results[1].observations;
      if (results[2] && Array.isArray(results[2].entries)) state.activity.audit = results[2].entries;
      state.activity.loaded = true;
      renderActivity();
    }

    function renderActivity() {
      var el = document.getElementById('view-activity');
      var obs = state.activity.observations;
      var sessions = state.activity.sessions;

      var TOOL_TYPE_MAP = { Read: 'file_read', Write: 'file_write', Edit: 'file_edit', Bash: 'command_run', Grep: 'search', Glob: 'search', WebFetch: 'web_fetch', WebSearch: 'web_fetch', AskUserQuestion: 'conversation', Task: 'subagent' };

      var html = '';

      html += '<div class="card"><div class="card-title">Activity Heatmap (Past Year)</div>';
      var dayCounts = {};
      obs.forEach(function(o) {
        try {
          var d = new Date(o.timestamp);
          var key = d.toISOString().slice(0, 10);
          dayCounts[key] = (dayCounts[key] || 0) + 1;
        } catch(e) {}
      });
      sessions.forEach(function(s) {
        try {
          var d = new Date(s.startedAt);
          var key = d.toISOString().slice(0, 10);
          dayCounts[key] = (dayCounts[key] || 0) + 1;
        } catch(e) {}
      });

      var maxCount = 0;
      Object.keys(dayCounts).forEach(function(k) { if (dayCounts[k] > maxCount) maxCount = dayCounts[k]; });

      var today = new Date();
      var dayLabels = ['Mon', '', 'Wed', '', 'Fri', '', ''];
      html += '<div class="heatmap-labels">';
      dayLabels.forEach(function(l) { html += '<span style="width:10px;text-align:center;">' + l + '</span>'; });
      html += '</div>';
      html += '<div class="heatmap-wrap"><div class="heatmap-grid">';
      for (var w = 51; w >= 0; w--) {
        for (var d = 0; d < 7; d++) {
          var cellDate = new Date(today);
          cellDate.setDate(cellDate.getDate() - (w * 7 + (6 - d)));
          var key = cellDate.toISOString().slice(0, 10);
          var count = dayCounts[key] || 0;
          var level = count === 0 ? '' : count <= (maxCount * 0.25) ? 'level-1' : count <= (maxCount * 0.5) ? 'level-2' : count <= (maxCount * 0.75) ? 'level-3' : 'level-4';
          var title = key + ': ' + count + ' event' + (count !== 1 ? 's' : '');
          html += '<div class="heatmap-cell ' + level + '" title="' + esc(title) + '"></div>';
        }
      }
      html += '</div></div>';
      html += '<div style="display:flex;align-items:center;gap:4px;margin-top:8px;font-size:10px;color:var(--ink-faint);font-family:var(--font-mono);justify-content:flex-end;">Less ';
      html += '<div class="heatmap-cell" style="display:inline-block;"></div>';
      html += '<div class="heatmap-cell level-1" style="display:inline-block;"></div>';
      html += '<div class="heatmap-cell level-2" style="display:inline-block;"></div>';
      html += '<div class="heatmap-cell level-3" style="display:inline-block;"></div>';
      html += '<div class="heatmap-cell level-4" style="display:inline-block;"></div>';
      html += ' More</div>';
      html += '</div>';

      var typeCounts = {};
      obs.forEach(function(o) {
        var t = o.type || TOOL_TYPE_MAP[o.toolName] || (o.hookType ? o.hookType.replace(/_/g, ' ') : 'other');
        typeCounts[t] = (typeCounts[t] || 0) + 1;
      });
      var typeList = Object.keys(typeCounts).sort(function(a, b) { return typeCounts[b] - typeCounts[a]; });
      var totalObs = obs.length || 1;

      html += '<div class="two-col" style="margin-top:16px;">';

      html += '<div class="card"><div class="card-title">Type Breakdown</div>';
      if (typeList.length === 0) {
        html += '<div style="font-size:13px;color:var(--ink-faint);font-style:italic;">No observations yet</div>';
      } else {
        html += '<div class="bar-chart">';
        typeList.slice(0, 12).forEach(function(t) {
          var pct = Math.round((typeCounts[t] / totalObs) * 100);
          var color = OBS_TYPE_COLORS[t] || '#666666';
          html += '<div class="bar-row"><span class="bar-label">' + esc(t.replace(/_/g, ' ')) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div><span class="bar-value">' + typeCounts[t] + '</span></div>';
        });
        html += '</div>';
      }
      html += '</div>';

      html += '<div class="card"><div class="card-title">Activity Feed</div>';
      var sortedObs = obs.slice().sort(function(a, b) { return (b.timestamp || '').localeCompare(a.timestamp || ''); });
      if (sortedObs.length === 0) {
        html += '<div style="font-size:13px;color:var(--ink-faint);font-style:italic;">No recent activity</div>';
      } else {
        sortedObs.slice(0, 20).forEach(function(o) {
          var type = o.type || TOOL_TYPE_MAP[o.toolName] || 'other';
          var typeColor = OBS_TYPE_COLORS[type] || '#666666';
          var icon = OBS_TYPE_ICONS[type] || '&#128196;';
          var title = o.title || o.toolName || (o.hookType ? o.hookType.replace(/_/g, ' ') : 'Observation');

          html += '<div class="activity-feed-item">';
          html += '<div class="activity-feed-icon" style="color:' + typeColor + ';border-color:' + typeColor + ';">' + icon + '</div>';
          html += '<div class="activity-feed-body">';
          html += '<div class="activity-feed-title">' + esc(truncate(title, 60)) + '</div>';
          if (o.narrative) html += '<div style="font-size:12px;color:var(--ink-muted);margin-top:2px;">' + esc(truncate(o.narrative, 100)) + '</div>';
          html += '<div class="activity-feed-meta">' + esc(type.replace(/_/g, ' '));
          if (o.files && o.files.length) html += ' &middot; <span class="tag file-tag" style="font-size:9px;padding:0 4px;">' + esc(o.files[0].split('/').pop()) + '</span>';
          html += ' &middot; ' + esc(shortTime(o.timestamp)) + '</div>';
          html += '</div></div>';
        });
      }
      html += '</div>';

      html += '</div>';

      setViewHtml(el, html);
    }

    async function loadSessions() {
      var el = document.getElementById('view-sessions');
      if (!state.sessions.loaded) el.innerHTML = '<div class="loading">Loading sessions...</div>';
      var request = ++sessionsRequest;
      var seqAtStart = liveSessionSeq;
      var result = await recentViewerPage('sessions');
      if (request !== sessionsRequest) return;
      if (!result) { showRecentError(el, 'sessions'); return; }
      if (result && Array.isArray(result.sessions)) {
        state.sessions.items = replaySessionEvents(result.sessions, seqAtStart);
      } else if (!state.sessions.loaded) {
        state.sessions.items = [];
      }
      state.sessions.items = state.sessions.items.slice(0, LIVE_BUFFER_MAX);
      state.sessions.count = result;
      state.sessions.detailStale = true;
      state.sessions.loaded = true;
      renderSessions();
    }

    function renderSessions() {
      var el = document.getElementById('view-sessions');
      var items = state.sessions.items.slice().sort(function(a, b) {
        return (b.startedAt || '').localeCompare(a.startedAt || '');
      });

      var count = state.sessions.count;
      var html = '<p class="metric-note" role="status">' + (sessionTotalAvailable(count) ? 'Total sessions: ' + count.total + ' · ' : '') + esc(sessionCountNotice(count)) + ' · ' + items.length + ' recent loaded</p><div class="sessions-layout"><div class="session-list">';
      if (items.length === 0) {
        html += '<div class="empty-state"><div class="empty-icon">&#128466;</div><p>' + (sessionTotalAvailable(count) && count.total === 0 ? 'No sessions' : 'No recent sessions loaded') + '</p></div>';
      } else {
        items.forEach(function(s) {
          var statusBadge = s.status === 'active' ? 'badge-green' : s.status === 'completed' ? 'badge-blue' : 'badge-muted';
          var id = sessionId(s);
          var selected = id && state.sessions.selectedId === id;
          html += '<div class="session-item' + (selected ? ' selected' : '') + '"' + (id ? ' data-action="select-session" data-session-id="' + esc(id) + '" role="button" tabindex="0" aria-expanded="' + (selected ? 'true' : 'false') + '"' : '') + '>';
          html += '<div class="session-top"><span class="session-project">' + esc(sessionDisplayName(s)) + '</span>';
          html += '<span class="badge ' + statusBadge + '">' + esc(s.status) + '</span></div>';
          var preview = s.firstPrompt || summaryText(s.summary) || '';
          if (preview) {
            html += '<div class="session-preview" style="font-size:13px;color:var(--ink);margin:4px 0;line-height:1.4;">' + esc(truncate(preview, 140)) + '</div>';
          }
          html += '<div class="session-meta">' + esc(shortSessionId(s, 12) || 'missing id') + ' &middot; ' + esc(formatTime(s.startedAt));
          html += ' &middot; ' + (s.observationCount || 0) + ' obs';
          if (s.model) html += ' &middot; ' + esc(s.model);
          html += '</div></div>';
        });
      }
      html += '</div>';
      html += '<div id="session-detail"></div></div>';
      setViewHtml(el, html);

      if (!state.sessions.selectedId) return;
      var cached = state.sessions.detailCache;
      if (cached && cached.id === state.sessions.selectedId && !state.sessions.detailStale) {
        var panel = document.getElementById('session-detail');
        if (panel && panel.innerHTML !== cached.html) {
          panel.innerHTML = cached.html;
          var reflectionButton = panel.querySelector('[data-action="reflect-project"]');
          if (reflectionButton) mountReflection(reflectionButton);
        }
        return;
      }
      renderSessionDetail();
    }

    function selectSession(id) {
      state.sessions.selectedId = state.sessions.selectedId === id ? null : id;
      renderSessions();
      // On the stacked layout (narrow screens) the detail renders below
      // the list; bring it into view. The wide two-pane layout keeps the
      // panel sticky beside the list, so no scroll is needed there.
      if (
        state.sessions.selectedId &&
        window.matchMedia('(max-width: 1100px)').matches
      ) {
        var panel = document.getElementById('session-detail');
        if (panel && panel.scrollIntoView) {
          panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    }

    var sessionDetailRequest = 0;
    async function renderSessionDetail() {
      var panel = document.getElementById('session-detail');
      if (!panel) return;
      var s = state.sessions.items.find(function(x) { return sessionId(x) === state.sessions.selectedId; });
      var id = sessionId(s);
      if (!s || !id) { panel.innerHTML = ''; return; }

      state.sessions.detailStale = false;
      var request = ++sessionDetailRequest;
      var cached = state.sessions.detailCache;
      if (!cached || cached.id !== id) {
        panel.innerHTML = '<div class="detail-panel"><h3>Loading session details…</h3></div>';
      }

      var obsRes = await recentViewerPage('observations', null, id);
      if (request !== sessionDetailRequest || state.sessions.selectedId !== id) return;
      if (!obsRes) { state.sessions.detailStale = true; showRecentError(panel, 'observations'); return; }
      var obs = obsRes.observations;

    var projectReflections = new Map();
    function reflectionText(value) {
      return typeof value === 'string' && value.length > 0 && new TextEncoder().encode(value).length <= 256;
    }
    function reflectionPanel(project) {
      if (!reflectionText(project)) return '<div class="card">Project reflection unavailable: this session has no valid project.</div>';
      return '<div class="card" style="margin-top:12px;overflow-wrap:anywhere;" data-reflection-panel>' +
        '<div class="card-title">Project reflection</div><p>Bounded indexed evidence for ' + esc(project) +
        '. Covers project memories and observations; other families and global coverage are excluded.</p>' +
        '<button class="btn btn-primary" data-action="reflect-project" data-project="' + esc(project) + '">Reflect project</button>' +
        '<p data-reflection-status role="status" aria-live="polite">Ready</p>' +
        '<div class="card-title">Canonical project insights</div><div data-reflection-insights aria-live="polite">Loading insights...</div></div>';
    }
    function currentReflection(btn, project) {
      return btn && btn.isConnected !== false && btn.getAttribute('data-project') === project;
    }
    function renderReflection(btn, operation) {
      if (!currentReflection(btn, operation.payload.project)) return;
      btn.disabled = operation.busy || operation.stopped;
      btn.textContent = operation.busy ? 'Reflecting project...' : operation.unknown ? 'Resume reflection' :
        operation.stopped ? 'Reflection ended' : operation.started ? 'Continue reflection' : 'Reflect project';
      btn.closest('[data-reflection-panel]').querySelector('[data-reflection-status]').textContent = operation.message;
    }
    function mountReflection(btn) {
      var project = btn.getAttribute('data-project');
      var operation = projectReflections.get(project);
      if (operation) { operation.button = btn; renderReflection(btn, operation); }
      loadReflectionInsights(btn, project);
    }
    async function loadReflectionInsights(btn, project) {
      var list = btn.closest('[data-reflection-panel]').querySelector('[data-reflection-insights]');
      var request = {};
      list.reflectionRequest = request;
      list.textContent = 'Loading insights...';
      var result;
      try { result = await apiGet('insights?project=' + encodeURIComponent(project) + '&limit=20'); } catch (_) { result = null; }
      if (!currentReflection(btn, project) || list.isConnected === false || list.reflectionRequest !== request) return;
      if (!result || !Array.isArray(result.insights) || result.success === false) {
        list.textContent = 'Could not load project insights.'; return;
      }
      var insights = result.insights.filter(function(item) { return item && item.project === project; }).slice(0, 20);
      list.innerHTML = insights.length ? insights.map(function(item) {
        return '<div style="margin-top:8px;"><strong>' + esc(item.title || '') + '</strong><div style="white-space:pre-wrap;">' +
          esc(item.content || '') + '</div></div>';
      }).join('') : '<p>No canonical insights for this project yet.</p>';
    }
    function reflectionContinuation(token, operation, result) {
      if (!token || typeof token !== 'object' || Array.isArray(token) || Object.keys(token).length !== 5) return false;
      if (!['jobId', 'requestId', 'checkpoint'].every(function(key) { return reflectionText(token[key]); }) ||
          token.project !== operation.payload.project || token.requestId !== operation.payload.requestId || token.jobId !== result.jobId ||
          !Number.isSafeInteger(token.cut) || token.cut < 1 || token.cut > 256) return false;
      var previous = operation.payload.continuation;
      if (previous) return token.jobId === previous.jobId && token.cut === previous.cut + 1;
      return token.cut === 1;
    }
    function reflectionMessage(result) {
      var labels = { pending: 'Pending', blocked: 'Blocked: outcome unresolved',
        partial: 'Partial: selection unfinished', failed: 'Failed', completed: 'Completed bounded selection',
        waiting_index: 'Waiting for index', waiting_graph: 'Waiting for graph', waiting_scope: 'Waiting for scope',
        waiting_budget: 'Waiting for budget', waiting_batch: 'Waiting for batch' };
      var message = labels[result.status];
      ['processedClusters', 'clustersSkipped', 'appliedInsights'].forEach(function(key) {
        if (Number.isSafeInteger(result[key]) && result[key] >= 0) message += '. ' +
          ({ processedClusters: 'Clusters processed', clustersSkipped: 'Clusters skipped', appliedInsights: 'Insights applied' })[key] + ': ' + result[key];
      });
      var coverage = result.coverage;
      if (coverage) {
        var families = ['memory', 'observation', 'fact', 'lesson', 'crystal'];
        ['requestedFamilies', 'excludedFamilies'].forEach(function(key) {
          if (Array.isArray(coverage[key])) message += '. ' + (key === 'requestedFamilies' ? 'Selected families: ' : 'Excluded families: ') +
            coverage[key].filter(function(family) { return families.indexOf(family) >= 0; }).join(', ');
        });
        message += coverage.complete === true && result.completed === true ? '. Selection coverage complete' : '. Selection coverage incomplete';
      }
      return message + '. Global family coverage is incomplete.';
    }
    async function reflectProject(project, btn) {
      if (!reflectionText(project) || !currentReflection(btn, project)) return;
      var operation = projectReflections.get(project);
      if (!operation) {
        operation = { payload: { project: project, requestId: crypto.randomUUID(), manual: true, maxClusters: 1 },
          started: false, stopped: false, busy: false, unknown: false, message: 'Ready' };
        projectReflections.set(project, operation);
      }
      if (operation.busy || operation.stopped) return;
      operation.button = btn;
      operation.busy = true;
      operation.started = true;
      operation.message = 'Pending: reflecting bounded project evidence...';
      renderReflection(btn, operation);
      var result;
      try { result = await apiPost('reflect', operation.payload); } catch (_) { result = null; }
      operation.busy = false;
      operation.unknown = true;
      operation.message = 'Outcome unknown. Resume explicitly with the same request; no automatic retry.';
      if (!currentReflection(btn, project)) {
        renderReflection(operation.button, operation);
        return;
      }
      if (result) {
        var statuses = ['pending', 'blocked', 'partial', 'failed', 'completed',
          'waiting_index', 'waiting_graph', 'waiting_scope', 'waiting_budget', 'waiting_batch'];
        var valid = reflectionText(result.jobId) && result.requestId === operation.payload.requestId &&
          (!operation.jobId || result.jobId === operation.jobId) && statuses.indexOf(result.status) >= 0 &&
          typeof result.completed === 'boolean' && (result.completed === (result.status === 'completed')) &&
          (!result.continuation || reflectionContinuation(result.continuation, operation, result));
        if (valid) {
          operation.jobId = result.jobId;
          operation.unknown = false;
          operation.stopped = result.terminal === true || ['completed', 'partial', 'failed'].indexOf(result.status) >= 0;
          operation.message = reflectionMessage(result);
          if (result.continuation && !operation.stopped) {
            var token = result.continuation;
            operation.payload = { project: project, requestId: operation.payload.requestId, manual: true, maxClusters: 1,
              continuation: { jobId: token.jobId, project: token.project, requestId: token.requestId, checkpoint: token.checkpoint, cut: token.cut } };
          } else if (!operation.stopped) {
            operation.stopped = true;
            operation.message += ' Continuation unavailable; operation paused.';
          }
          loadReflectionInsights(btn, project);
        } else {
          operation.stopped = true;
          operation.message = 'Reflection response could not be validated. Operation paused; no new request was created.';
        }
      }
      renderReflection(btn, operation);
    }

    async function endSession(id) {
      await apiPost('session/end', { sessionId: id });
      loadSessions();
    }

    async function summarizeSession(id, btn) {
      function validSummaryRecovery(token, id) {
        if (!token || typeof token !== 'object' || Array.isArray(token)) return false;
        var strings = ['operationId', 'jobId', 'project', 'sessionId', 'sourceFingerprint', 'unitId', 'deliveryId'];
        return Object.keys(token).length === 9 && strings.every(function(key) {
          return typeof token[key] === 'string' && token[key].length > 0 && token[key].length <= 512 &&
            token[key] === token[key].trim();
        }) && Number.isSafeInteger(token.step) && token.step >= 0 &&
          Number.isSafeInteger(token.round) && token.round >= 0 && token.sessionId === id;
      }
      if (!btn || btn.disabled || btn.isConnected === false) return;
      var recovery = btn.summaryRecovery;
      btn.summaryRecovery = null;
      var payload = { sessionId: id };
      if (validSummaryRecovery(recovery, id)) payload.continuation = recovery;
      btn.textContent = 'Summarizing...';
      btn.disabled = true;
      try {
        var result = await apiPost('summarize', payload);
        var cuts = 0;
        var ceiling = result && result.maxRequests;
        var operationId = result && result.continuation && result.continuation.operationId;
        while (result && result.success === true && result.completed === false && result.continuation &&
            !result.busy && !result.skipped && !result.retryAt &&
            Number.isSafeInteger(ceiling) && cuts < ceiling &&
            result.continuation.operationId === operationId && result.continuation.sessionId === id) {
          cuts++;
          btn.textContent = 'Summarizing... ' + cuts;
          result = await apiPost('summarize', { sessionId: id, continuation: result.continuation });
        }
        if (result && result.success === false && validSummaryRecovery(result.continuation, id) && btn.isConnected !== false) {
          btn.summaryRecovery = result.continuation;
          btn.textContent = 'Retry / Regenerate';
        } else if (result && result.completed === false && result.continuation && cuts >= ceiling) {
          btn.textContent = 'Limit reached';
        } else
        if (result && result.success === true && (result.queued === true || result.completed === false)) {
          btn.textContent = result.busy ? 'Busy' : result.retryAt ? 'Retry later' : 'Queued';
        } else if (result && result.success === true && result.summary) {
          btn.textContent = 'Done';
        } else {
          btn.textContent = 'Failed';
        }
      } catch (_) {
        btn.textContent = 'Failed';
      } finally {
        if (btn.summaryRecovery) {
          btn.disabled = false;
        } else {
          setTimeout(function() { btn.textContent = 'Summarize'; btn.disabled = false; }, 2000);
        }
      }
    }

    function renderActions() {
      var el = document.getElementById('view-actions');
      var items = state.actions.items;
      var introCard = '<div class="card" style="margin-bottom:12px;padding:12px;background:var(--bg-subtle);">' +
        '<div style="font-size:13px;color:var(--ink-muted);line-height:1.5;">' +
        '<strong>Actions</strong> are follow-ups the agent surfaced during sessions — decisions to revisit, files to inspect, tasks blocked on input. Status flows pending &rarr; active &rarr; done/blocked; the <em>frontier</em> marks what is unblocked and ready to pick up next.' +
        '</div></div>';
      var search = state.actions.search.toLowerCase();
      var statusFilter = state.actions.statusFilter;
      var frontierIds = new Set((state.actions.frontier || []).map(function(a) { return a.id; }));

      if (search) {

    var HEALTH_LEVEL_BADGES = { ok: 'badge-green', info: 'badge-blue', warn: 'badge-yellow', error: 'badge-red' };

    var UPDATE_ACTIVE_PHASES = { downloading: true, stopping: true, installing: true, starting: true };
    var UPDATE_PHASE_LABELS = {
      idle: 'Ready to check for a release', downloading: 'Downloading verified release',
      stopping: 'Stopping AgentMemory', installing: 'Installing release',
      starting: 'Starting AgentMemory', complete: 'Update complete', failed: 'Update failed'
    };
    var updateControls = (function() {

    async function updateRequest(path, options) {
      var response;
      try {
        var settings = Object.assign({ cache: 'no-store', credentials: 'same-origin', mode: 'same-origin' }, options || {});
        response = await fetch('/update/' + path, settings);
      } catch (error) {
        var offline = new Error('Cannot reach the local viewer.');
        offline.status = 0;
        throw offline;
      }
      var body = await response.json().catch(function() { return null; });
      if (!response.ok) {
        var failed = new Error(body && typeof body.error === 'string' ? body.error : 'Update request failed (' + response.status + ').');
        failed.status = response.status;
        throw failed;
      }
      if (!body || typeof body !== 'object') throw new Error('The update response was invalid.');
      return body;
    }

    function updateError(error) {
      return error && error.message ? error.message : 'The update request failed.';
    }

    function scheduleUpdatePoll() {
      var u = state.health.update;
      if (u.pollTimer) return;
      u.pollTimer = setTimeout(async function() {
        u.pollTimer = null;
        try {
          var data = await updateRequest('status');
          u.support = data.support;
          u.status = data.status;
          u.csrfToken = data.csrfToken || '';
          u.reconnecting = false;
          u.pollMisses = 0;
          u.error = '';
          if (u.status && UPDATE_ACTIVE_PHASES[u.status.phase]) scheduleUpdatePoll();
        } catch (error) {
          if (error.status === 401 || error.status === 403 || error.status === 409) {
            u.csrfToken = '';
            u.reconnecting = false;
            u.error = updateError(error);
          } else {
            u.reconnecting = true;
            u.pollMisses++;
            if (u.pollMisses < 1200) scheduleUpdatePoll();
            else u.error = 'AgentMemory did not reconnect. Check the service, then retry the status check.';
          }
        }
        renderHealth();
      }, 2000);
    }

    async function loadUpdateStatus() {
      var u = state.health.update;
      try {
        var data = await updateRequest('status');
        u.support = data.support;
        u.status = data.status;
        u.csrfToken = data.csrfToken || '';
        u.reconnecting = false;
        u.pollMisses = 0;
        u.error = '';
        if (u.status && UPDATE_ACTIVE_PHASES[u.status.phase]) scheduleUpdatePoll();
      } catch (error) {
        if (error.status === 401 || error.status === 403 || error.status === 409) {
          u.csrfToken = '';
        }
        u.error = updateError(error);
      }
      renderHealth();
    }

    function focusUpdateAction(action) {
      var button = document.querySelector('#view-health [data-action="' + action + '"]');
      if (button) button.focus();
    }

    async function checkReleaseUpdate() {
      var u = state.health.update;
      if (u.checking || u.starting || (u.support && !u.support.supported) || (u.status && UPDATE_ACTIVE_PHASES[u.status.phase])) return;
      u.checking = true;
      u.check = null;
      u.error = '';
      renderHealth();
      try {
        u.check = await updateRequest('check');
        u.support = { supported: true };
      } catch (error) {
        u.error = updateError(error);
      } finally {
        u.checking = false;
        renderHealth();
        if (u.check && u.check.available) focusUpdateAction('confirm-update');
        else focusUpdateAction('check-update');
      }
    }

    async function startReleaseUpdateFromViewer() {
      var u = state.health.update;
      if (u.starting || u.checking || !u.check || !u.check.available || !u.support || !u.support.supported) return;
      u.starting = true;
      u.error = '';
      renderHealth();
      var postAttempted = false;
      try {
        var fresh = await updateRequest('status');
        u.support = fresh.support;
        u.status = fresh.status;
        u.csrfToken = fresh.csrfToken || '';
        if (!u.support || !u.support.supported) throw new Error((u.support && u.support.reason) || 'Updates are unavailable.');
        if (u.status && UPDATE_ACTIVE_PHASES[u.status.phase]) throw new Error('An update is already in progress.');
        if (!u.csrfToken) throw new Error('Update authorization is unavailable. Retry the status check.');
        postAttempted = true;
        var result = await updateRequest('start', {
          method: 'POST',
          headers: { 'X-AgentMemory-Update-Token': u.csrfToken }
        });
        u.status = result;
        u.check = null;
        if (UPDATE_ACTIVE_PHASES[result.phase]) scheduleUpdatePoll();
      } catch (error) {
        if (error.status === 401) {
          u.csrfToken = '';
          u.error = updateError(error);
        } else if (postAttempted && error.status === 0) {
          u.check = null;
          u.reconnecting = true;
          scheduleUpdatePoll();
        } else {
          u.check = null;
          if (error.status === 403 || error.status === 409) await loadUpdateStatus();
          u.error = error.status === 403 ? 'Update authorization expired. Check for a release again.' : updateError(error);
        }
      } finally {
        u.starting = false;
        renderHealth();
      }
    }

    function renderUpdateCard() {
      var u = state.health.update;
      var s = u.status || { phase: 'idle' };
      var busy = !!UPDATE_ACTIVE_PHASES[s.phase] || u.starting || u.reconnecting;
      var current = (s.phase === 'complete' && s.targetVersion) || s.currentVersion ||
        (state.health.report && state.health.report.service && state.health.report.service.version) || 'unknown';
      var html = '<section class="card" aria-labelledby="update-title" aria-busy="' +
        (u.checking || u.starting ? 'true' : 'false') + '"><div class="card-title" id="update-title">Release update</div>';
      html += '<div role="status" aria-live="polite" aria-atomic="true">';
      html += '<p class="update-note">Current version: v' + esc(current) +
        (s.targetVersion && s.phase !== 'complete' ? ' · Target: v' + esc(s.targetVersion) : '') + '</p>';
      html += '<p class="update-note">' + esc(u.reconnecting ? 'Reconnecting to AgentMemory…' : UPDATE_PHASE_LABELS[s.phase] || 'Checking update status') + '</p>';
      if (s.message) html += '<p class="update-note">' + esc(s.message) + '</p>';
      if (s.errorCode) html += '<p class="update-note error">Error code: ' + esc(s.errorCode) + '</p>';
      if (u.error) html += '<p class="update-note error">' + esc(u.error) + '</p>';
      if (!u.support && !u.status) html += '<p class="update-note">Check for a release or retry the local update status.</p>';
      html += '</div>';
      if (u.support && !u.support.supported) {
        html += '<p class="update-note">' + esc(u.support.reason || 'Updates are unavailable for this installation.') + '</p>';
        html += '<div class="update-actions"><button class="btn" disabled title="' + esc(u.support.reason || 'Updates unavailable') + '">Check for update</button></div>';
      } else if (u.check && u.check.available && !busy) {
        html += '<p class="update-note">Release v' + esc(u.check.version) + ' is available (currently v' + esc(u.check.currentVersion) + '). Installing it will briefly restart AgentMemory.</p>';
        html += '<div class="update-actions"><button class="btn btn-primary" data-action="confirm-update">Install and restart</button><button class="btn" data-action="cancel-update">Cancel</button></div>';
      } else if (u.check && !u.check.available && !busy) {
        html += '<p class="update-note">Already up to date.</p><div class="update-actions"><button class="btn" data-action="check-update">Check again</button></div>';
      } else {
        html += '<div class="update-actions"><button class="btn btn-primary" data-action="check-update"' +
          (busy || u.checking ? ' disabled' : '') + '>' + (u.checking ? 'Checking release…' : 'Check for update') + '</button>';
        if (!busy) html += '<button class="btn" data-action="refresh-update-status">View update status</button>';
        else if (u.error || u.reconnecting) html += '<button class="btn" data-action="refresh-update-status">Retry status</button>';

          var path = entity + '?latest=true&limit=' + Math.min(16, LIVE_BUFFER_MAX - rows.length) + (selectedSession ? '&sessionId=' + encodeURIComponent(selectedSession) : '') + (cursor ? '&cursor=' + encodeURIComponent(cursor) : '');
          var result = await api(path, { readErrorBody: true, signal: signal });
          if (result && result.restartRequired) { restart = true; break; }
          if (!result || result.error || result.status !== 'ready' || !Array.isArray(result[entity])) {
            recentHistoryReasons[entity] = result && (result.reason || result.error || result.status) || 'Request failed';
            recentHistoryStates[entity] = result && (result.status === 'preparing' || result.reason === 'recent_index_not_ready') ? 'preparing' : result ? 'unavailable' : 'transport';
            return null;
          }
          envelope = result;
          rows = rows.concat(result[entity]).slice(0, LIVE_BUFFER_MAX);
          cursor = result.nextCursor;
          if (!cursor) break;
        }
        if (restart || entity === 'observations' && observationSeq - sinceObservation > LIVE_BUFFER_MAX || entity === 'sessions' && liveSessionSeq - sinceSession > LIVE_SESSION_LOG_MAX) continue;
        if (!envelope) return null;
        if (entity === 'observations') rows = mergeObservations(rows, observationLog.filter(function(entry) {
          return entry.seq > sinceObservation && (!selectedSession || entry.observation.sessionId === selectedSession);
        }).map(function(entry) { return entry.observation; }));
        else rows = replaySessionEvents(rows, sinceSession).slice(0, LIVE_BUFFER_MAX);
        envelope[entity] = rows;
        envelope.nextCursor = cursor;
        envelope.partial = !!cursor || !!initialCursor;
        if (entity !== 'sessions') envelope.total = envelope.partial ? null : rows.length;
        envelope.returnedCount = rows.length;
        delete recentHistoryReasons[entity];
        delete recentHistoryStates[entity];
        return envelope;
      }
      return null;
    }

    function looksLikeObservation(obj) {
      return !!(obj && typeof obj === 'object' && obj.id && obj.timestamp);
    }

    function sessionKey(s) {
      return s && (s.id || s.sessionId);
    }

    function upsertSessionIn(list, session) {
      var key = sessionKey(session);
      if (!key) return list;
      var index = list.findIndex(function(s) { return sessionKey(s) === key; });
      if (index >= 0) list[index] = Object.assign({}, list[index], session);
      else list.unshift(session);
      return list;
    }

    function removeSessionFrom(list, key) {
      return list.filter(function(s) { return sessionKey(s) !== key; });
    }

    function patchSessionCount(list, key, count) {
      list.forEach(function(s) {
        if (sessionKey(s) === key) s.observationCount = count;
      });

    var LIVE_SESSION_LOG_MAX = 500;
    var liveSessionLog = [];
    var liveSessionSeq = 0;

    function applySessionEvent(list, entry) {
      if (entry.type === 'session.updated') return upsertSessionIn(list, entry.data.session);
      if (entry.type === 'session.deleted') return removeSessionFrom(list, entry.data.sessionId);
      patchSessionCount(list, entry.data.sessionId, entry.data.observationCount);
      return list;
    }

    function replaySessionEvents(list, sinceSeq) {
      liveSessionLog.forEach(function(entry) {
        if (entry.seq > sinceSeq) list = applySessionEvent(list, entry);
      });
      return list;

    function handleLiveEvent(type, data) {
      if (type === 'raw_observation' || type === 'compressed_observation') {
        routeWsMessage({ observation: data.observation, kind: type === 'compressed_observation' ? 'compressed' : 'raw' });
        return;
      }
      if (type === 'memory.updated' || type === 'memory.deleted') {
        refreshMemoryCount();
        tabFetchedAt.memories = 0;
        scheduleMemoriesReload();
        return;
      }
      var isSessionEvent =
        (type === 'session.updated' && data.session && sessionKey(data.session)) ||
        ((type === 'session.activity' || type === 'session.deleted') && data.sessionId);
      if (!isSessionEvent) return;
      scheduleViewerStatusRefresh();
      var entry = { seq: ++liveSessionSeq, type: type, data: data };
      liveSessionLog.push(entry);
      if (liveSessionLog.length > LIVE_SESSION_LOG_MAX) liveSessionLog.shift();
      state.dashboard.sessions = applySessionEvent(state.dashboard.sessions, entry);
      state.sessions.items = applySessionEvent(state.sessions.items, entry).slice(0, LIVE_BUFFER_MAX);
      state.dashboard.sessions = state.dashboard.sessions.slice(0, LIVE_BUFFER_MAX);
      var touched = type === 'session.updated' ? sessionKey(data.session) : data.sessionId;
      if (type !== 'session.activity' && touched === state.sessions.selectedId) {
        state.sessions.detailStale = true;
      }
      scheduleLiveRender();
    }

    function handleStreamEvent(msg) {
      var evt = msg.event;
      if (!evt) return;
      if (evt.type === 'sync') { finishLiveSubscription(); return; }
      if (evt.type === 'event' && evt.event && evt.event.type) {
        handleLiveEvent(evt.event.type, evt.event.data || {}); return;
      }
      var payload = evt.data;
      if (!payload) return;
      var type = evt.event_type || payload.type;
      if (type && (type.indexOf('session.') === 0 || type.indexOf('memory.') === 0)) {
        handleLiveEvent(type, payload); return;
      }
      var observation = payload.observation || payload;
      if (looksLikeObservation(observation)) routeWsMessage({ observation: observation,
        kind: type === 'compressed_observation' || payload.type === 'compressed' ? 'compressed' : 'raw' });
    }

    function routeWsMessage(msg) {
      if (!looksLikeObservation(msg.observation)) return;
      var observation = Object.assign({}, msg.observation);
      observation.__liveCompressed = msg.kind === 'compressed';
      observationLog.push({ seq: ++observationSeq, observation: observation });
      if (observationLog.length > LIVE_BUFFER_MAX) observationLog.shift();
      scheduleViewerStatusRefresh();
      if (observation.sessionId === state.timeline.sessionId) {
        state.timeline.observations = mergeObservations(state.timeline.observations, [observation]);
        if (state.activeTab === 'timeline') renderObservations();
